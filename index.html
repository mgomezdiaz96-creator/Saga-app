  <script>
    const topics = [
      {id:'politics',icon:'🎧',title:'Why everything is political',tagline:'Culture, power & the ideas between them',tone:'green'},
      {id:'business',icon:'🪴',title:'Doing business',tagline:'Turn a good idea into something real',tone:'orange'},
      {id:'hormones',icon:'🌙',title:'Understanding your hormones',tagline:'Feel informed, ask better questions',tone:'lav'},
      {id:'photography',icon:'📷',title:'Try a new hobby',tagline:'Notice more, offline',tone:'yellow'}
    ];
    const categories=[
      {id:'art',label:'Art'},{id:'history',label:'History'},{id:'culture',label:'Culture & power'},
      {id:'ideas',label:'Big ideas, made relatable'},{id:'business',label:'Business'},{id:'investing',label:'Investing'},
      {id:'nature',label:'Natural resources'},{id:'health',label:'Health & wellbeing'},{id:'literature',label:'Literature'}
    ];
    const categoryGuides={
      art:[{id:'art-power',title:'Art, power & who gets seen',desc:'Explore how images, institutions and artists shape what a culture remembers.'},{id:'protest-art',title:'The art of protest',desc:'Follow the symbols and stories people use to imagine change.'}],
      history:[{id:'salt',title:'Salt: A World History',desc:'Follow an everyday mineral through trade, empire, work and food.'},{id:'voynich',title:'The Voynich Manuscript',desc:'Explore the illustrated manuscript that still resists confident explanation.'}],
      culture:[{id:'politics',title:'Why everything is political',desc:'Connect political ideas to the books, music and culture around you.'},{id:'music-identity',title:'Music, identity & belonging',desc:'Explore how music carries memory, community and political meaning.'}],
      ideas:[{id:'isms',title:'Political isms, without the jargon',desc:'Build a clear map of the ideas shaping public life.'},{id:'everyday-power',title:'Where power shows up in everyday life',desc:'Find the systems and choices hidden in ordinary routines.'}],
      business:[{id:'business',title:'Doing business',desc:'Explore the practical choices behind building something sustainable.'},{id:'hospitality',title:'Unreasonable Hospitality',desc:'Look at the ideas and practices behind memorable service.'}],
      investing:[{id:'investing',title:'Investing, starting from zero',desc:'Get familiar with risk, time, markets and the language of investing.'},{id:'money',title:'Money and the choices around it',desc:'Explore how personal finance connects to wider economic systems.'}],

      health:[{id:'hormones',title:'Understanding your hormones',desc:'Explore possible factors behind energy and sleep, and prepare to advocate for yourself.'},{id:'cycle',title:'Your cycle and everyday energy',desc:'Build a grounded vocabulary for patterns, questions and conversations with a clinician.'}],
      literature:[{id:'fiction-politics',title:'Fiction as a way to test ideas',desc:'Explore how imagined worlds help us question the one we live in.'},{id:'brave-new-world',title:'Brave New World & social control',desc:'Read a classic novel through questions of pleasure, conformity and freedom.'}]
    };
    const trending=[
      {id:'salt',kind:'BOOK · HISTORY',title:'Salt: A World History',by:'Mark Kurlansky',desc:'The surprising history of a resource woven into food, trade and power.',art:'salt'},
      {id:'voynich',kind:'MYSTERY · MANUSCRIPT',title:'The Voynich Manuscript',by:'A book still full of questions',desc:'Plants, diagrams and writing that invite close looking—and careful claims.',art:'voynich'},
      {id:'music',kind:'GUIDE · CULTURE',title:'Music, identity & belonging',by:'A 4-touchpoint guide',desc:'Explore the stories and histories carried through the music we love.',art:'music'}
    ];
    const resources = [
      {id:'start',type:'A good place to start',tag:'Suggested first',title:'A field guide to the politics hiding in plain sight',desc:'Start by noticing the choices, values and power dynamics woven into everyday culture. A short, friendly introduction made for this syllabus.',time:'8 min read',emoji:'✳'},
      {id:'book-fiction',type:'Book',tag:'Fiction',title:'Brave New World',cover:'https://covers.openlibrary.org/b/isbn/9780060850524-L.jpg',author:'Aldous Huxley',desc:'A classic novel about pleasure, conformity and social control. Read it as a story first; notice what it makes you question about the world around you.',time:'A novel · dip in at your pace',emoji:'📖'},
      {id:'book-practical',type:'Book',tag:'Practical',title:'Political Ideologies: An Introduction',cover:'https://cdn.kobo.com/book-images/5e0335ba-bcc7-452e-a34a-6fe64663a1b4/1200/1200/False/political-ideologies-12.jpg',author:'Andrew Heywood',desc:'Andrew Heywood’s accessible map of the ideas and traditions that shape political life. Dip into the chapters that spark your curiosity.',time:'Choose a chapter',emoji:'📚'},
      {id:'podcast',type:'Podcast',tag:'Listen',title:'Singing the Troubles',desc:'The BBC World Service’s Cultural Frontline explores music and cultural identity across the Irish border. One way to hear how history and politics move through music.',time:'Podcast episode · 2018',emoji:'🎙️',url:'https://www.bbc.co.uk/programmes/w3cswp5x'},
      {id:'article',type:'Article',tag:'One perspective',title:'Against popular culture',desc:'Owen Hulatt introduces Theodor Adorno’s critical view of popular culture. Treat it as one influential lens, then ask what it helps you notice—and what it might miss.',time:'Aeon essay · 8 min',emoji:'📰',url:'https://aeon.co/essays/against-guilty-pleasures-adorno-on-the-crimes-of-pop-culture'},
      {id:'activity',type:'Activity',tag:'Culture Decoder',title:'Can you spot the idea behind the art?',desc:'Look at a familiar cultural moment and connect it to the values or assumptions it carries. No prior knowledge needed.',time:'5 min · play below',emoji:'🎨'},
      {id:'prompt',type:'Prompt',tag:'Go deeper',title:'What does this cultural choice make possible?',desc:'Choose a song, story or image. Who made it, what does it value, and how might different people read it differently?',time:'A question to carry with you',emoji:'✳'}
    ];
    const state = {page:'home',flow:'',quizStep:0,quizAnswers:[],selectedTopic:'politics',selectedCategory:'culture',selectedGuide:'politics',selectedTrend:'salt',selectedResource:'start',discoverSearch:'',depth:'quarterly',profileTab:'current',profileOwner:'mariela',curriculumFilter:'All',profileResourceFilter:'All',savedResourceFilter:'All',checklist:JSON.parse(localStorage.getItem('curio-checklist')||'{}'),saved:JSON.parse(localStorage.getItem('curio-saved')||'[]'),savedThemes:JSON.parse(localStorage.getItem('curio-themes')||'[]'),savedGuides:JSON.parse(localStorage.getItem('saga-guides')||'[]'),savedTrends:JSON.parse(localStorage.getItem('saga-trends')||'[]'),notes:localStorage.getItem('curio-notes')||'',gameComplete:false};
    const app=document.getElementById('app');
    const depthInfo={bimonthly:{label:'Bimonthly curriculum',count:'4 touchpoints',description:'A focused collection to explore over two months. Dip in whenever, with prompts to go deeper when you want.'},quarterly:{label:'Quarterly curriculum',count:'7 touchpoints',description:'A wider collection to explore over three months. Take your time, with prompts to go deeper when you want.'}};
    function activeResources(){return state.depth==='bimonthly'?resources.filter(r=>!['book-practical','article','prompt'].includes(r.id)):resources}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function topic(){return topics.find(t=>t.id===state.selectedTopic)||topics[0]}
    function discoverSearchResults(query){const q=(query||'').trim().toLowerCase();if(!q)return '';const found=[];categories.filter(x=>x.label.toLowerCase().includes(q)).forEach(x=>found.push({title:x.label,type:'Category',attr:'data-category',id:x.id}));topics.filter(x=>x.title.toLowerCase().includes(q)||x.tagline.toLowerCase().includes(q)).forEach(x=>found.push({title:x.title,type:'Theme',attr:'data-topic',id:x.id}));resources.filter(x=>x.title.toLowerCase().includes(q)||x.type.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q)).forEach(x=>found.push({title:x.title,type:x.type,attr:'data-open-resource',id:x.id}));trending.filter(x=>x.title.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q)).forEach(x=>found.push({title:x.title,type:'Trending',attr:'data-trend',id:x.id}));if(!found.length)return '<div class="discover-search-result"><b>No matches yet</b><small>Try another topic or resource type.</small></div>';return found.slice(0,8).map(x=>`<button class="discover-search-result" ${x.attr}="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.type)}</small></button>`).join('')}

    function updateNav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page||state.page==='resource'&&b.dataset.page==='curriculum'));const crumb={home:'Discover',discover:'Find your next thing',paths:'Choose your path',curriculum:'My curriculum',resource:'Resource details',profile:state.profileOwner==='mariela'?'My profile':'Friend profile',category:'Explore a category',guide:'Saga guide',trend:'Trending',saved:'Saved for later'};document.getElementById('crumb').innerHTML='Your space <span style="padding:0 7px;color:#c1c0b8">/</span> '+(crumb[state.page]||'Discover')}
    function render(){updateNav();if(state.page==='home')app.innerHTML=homeView();else if(state.page==='discover')app.innerHTML=discoverView();else if(state.page==='category')app.innerHTML=categoryView();else if(state.page==='guide')app.innerHTML=guideView();else if(state.page==='trend')app.innerHTML=trendView();else if(state.page==='resource')app.innerHTML=resourceInfoView();else if(state.page==='paths')app.innerHTML=pathsView();else if(state.page==='curriculum')app.innerHTML=curriculumView();else if(state.page==='profile')app.innerHTML=profileView();else if(state.page==='saved')app.innerHTML=savedView();else app.innerHTML=homeView()}
    function homeView(){const progress=activeResources().filter(r=>state.checklist[r.id]).length;return `
      <section class="hero"><div class="hero-copy"><div class="eyebrow">Your curiosity, at your pace</div><h1>Make room for knowledge.</h1><p>Explore something you care about—with stories, ideas and moments of discovery that fit real life.</p><div class="hero-actions"><button class="btn" data-action="know">Explore themes <span style="padding-left:7px">↗</span></button><button class="btn secondary" data-action="unsure">Take a quiz and find a theme <span style="padding-left:7px">↗</span></button></div></div><div class="hero-art" aria-hidden="true"><div class="sun"></div><div class="art-book"><small>Saga · resource library</small><span>Ideas for a life well noticed.</span></div><div class="art-spark">✳</div></div></section>

    function toggleTrendSave(){if(state.savedTrends.includes(state.selectedTrend))state.savedTrends=state.savedTrends.filter(x=>x!==state.selectedTrend);else state.savedTrends.push(state.selectedTrend);localStorage.setItem('saga-trends',JSON.stringify(state.savedTrends));render();showToast(state.savedTrends.includes(state.selectedTrend)?'Saved to your resources':'Removed from saved')}
    function savedResourceCards(scope){const filter=scope==='profile'?state.profileResourceFilter:state.savedResourceFilter,resourceItems=state.saved.map(id=>resources.find(r=>r.id===id)).filter(Boolean),trendItems=state.savedTrends.map(id=>trending.find(t=>t.id===id)).filter(Boolean),items=[...resourceItems.filter(r=>filter==='All'||filterFor(r.type)===filter).map(r=>resourceCard(r)),...trendItems.filter(t=>filter==='All'||(t.id==='salt'?'Books':t.id==='voynich'?'Manuscripts':'Guides')===filter).map(t=>`<article class="gallery-resource"><div class="gallery-media"><div class="trend-cover ${t.art}"><strong>${t.art==='salt'?'SALT':t.art==='voynich'?'✿ 𐂃 ❧':'MUSIC & BELONGING'}</strong></div></div><div class="gallery-resource-meta"><span class="resource-type">${t.id==='salt'?'Book':t.id==='voynich'?'Manuscript':'Guide'}</span><span class="resource-tag">Saved</span></div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="gallery-resource-actions"><button class="resource-open" data-trend="${t.id}">Open information page ↗</button><button class="resource-save saved" data-trend-save="${t.id}">♥</button></div></article>`)];return `<div class="resource-filters">${filterBar(filter,scope)}</div><div class="resource-gallery">${items.length?items.join(''):'<div class="side-card saved-empty"><b>No saved resources in this category yet.</b><p class="side-desc">Save a resource to add it to your collection.</p></div>'}</div>`}
    function profileView(){const own=state.profileOwner==='mariela',name=own?'Mariela':'Sofia';let content='';if(state.profileTab==='current')content=`<div class="profile-grid"><button class="profile-item" data-page="curriculum"><span class="item-emoji">🎧</span><b>Why everything is political</b><small>${depthInfo[state.depth].label} · ${Object.values(state.checklist).filter(Boolean).length} of ${resources.length} explored</small><div class="tiny-progress"><i style="width:${Math.max(12,Object.values(state.checklist).filter(Boolean).length/resources.length*100)}%"></i></div></button><div class="profile-item"><span class="item-emoji">🪴</span><b>Doing business</b><small>Saved for a future chapter</small></div><div class="profile-item"><span class="item-emoji">📷</span><b>Learning to notice</b><small>Photography · saved theme</small></div></div>`;if(state.profileTab==='past')content=`<div class="profile-grid"><div class="profile-item"><span class="item-emoji">🌿</span><b>Rest and daily rituals</b><small>Completed · Spring 2026</small></div><div class="profile-item"><span class="item-emoji">🎨</span><b>Art through the ages</b><small>Completed · Winter 2025</small></div></div>`;if(state.profileTab==='saved')content=`<div class="section-head" style="margin-top:0"><div><h2>Your resources</h2><p>Browse what you’ve saved by type.</p></div></div>${savedResourceCards('profile')}${state.savedGuides.length?`<div class="section-head"><div><h2>Saved guides</h2><p>Topics you want to return to.</p></div></div><div class="profile-grid">${state.savedGuides.map(id=>`<div class="profile-item"><span class="item-emoji">✳</span><b>${esc(id.replaceAll('-',' '))}</b><small>Saved guide</small></div>`).join('')}</div>`:''}<div class="section-head"><div><h2>Saved themes</h2><p>Threads to pick up another time.</p></div></div><div class="topic-grid">${state.savedThemes.includes('politics')?'<button class="topic-card" data-topic="politics"><span class="emoji">🎧</span><b>Why everything is political</b><small>Saved theme</small><span class="topic-bg"></span></button>':''}</div>`;return `<div class="profile-cover"><div class="profile-person"><div class="profile-avatar">${own?'M':'S'}</div><div><h1>${name}’s library</h1><p>${own?'Making room for all the things I want to know.':'Curious about books, culture and the world around us.'}</p></div></div><div class="profile-actions">${own?'':`<button class="btn secondary small" data-action="follow">${state.following?'✓ Following':'＋ Follow'}</button>`}<button class="btn small" data-action="share">↗ Share</button></div></div>
      <div class="match-card"><div><div class="match-title">✳ Your curiosity overlap</div><h3>${own?'You and Sofia have a few threads in common.':'You and Mariela have a few threads in common.'}</h3><p>You both want to explore <b>why everything is political</b>—and how books, music and culture carry ideas. A book-club dream team in the making.</p></div><div class="match-score">2<span style="font:500 11px var(--sans);color:#738075"> shared<br>topics</span></div></div>
      <div class="profile-tabs"><button data-tab="current" class="${state.profileTab==='current'?'active':''}">My curriculum</button><button data-tab="past" class="${state.profileTab==='past'?'active':''}">Past curriculums</button><button data-tab="saved" class="${state.profileTab==='saved'?'active':''}">Saved resources &amp; themes</button></div>${content}`}
    function savedView(){return `<div class="eyebrow">Your library</div><h1>Saved for later.</h1><p class="sub">A shelf of things you want to come back to when the moment feels right.</p><div class="section-head"><div><h2>Saved resources</h2><p>Filter books, podcasts, articles and more.</p></div></div>${savedResourceCards('saved')}${state.savedGuides.length?`<div class="section-head"><div><h2>Saved guides</h2><p>Topics you want to return to.</p></div></div><div class="profile-grid">${state.savedGuides.map(id=>`<div class="profile-item"><span class="item-emoji">✳</span><b>${esc(id.replaceAll('-',' '))}</b><small>Saved guide</small></div>`).join('')}</div>`:''}<div class="section-head"><div><h2>Saved themes</h2><p>Threads to pick up another time.</p></div></div><div class="topic-grid">${state.savedThemes.includes('politics')?'<button class="topic-card" data-topic="politics"><span class="emoji">🎧</span><b>Why everything is political</b><small>Saved theme</small><span class="topic-bg"></span></button>':''}<button class="topic-card" data-topic="business"><span class="emoji">🪴</span><b>Doing business</b><small>A future chapter</small><span class="topic-bg"></span></button><button class="topic-card" data-topic="photography"><span class="emoji">📷</span><b>Learning to notice</b><small>Photography &amp; creativity</small><span class="topic-bg"></span></button></div>`}
    function renderGame(){const modal=document.getElementById('gameModal');modal.classList.remove('hidden');modal.innerHTML=`<div class="modal-card"><button class="icon-btn modal-close" data-action="close-game" aria-label="Close">×</button><span class="pill">Culture Decoder · a tiny game</span><h2 id="gameTitle">What idea is hiding in the picture?</h2><p>Look at this imaginary poster from a future city. What does it seem to value most?</p><div class="activity-board" style="height:126px;background:#e9e4f1"><div class="art-tile" style="width:75px;height:93px;font-size:31px">◒</div><div class="art-tile" style="width:75px;height:93px;font-size:31px">✹</div><div class="art-tile" style="width:75px;height:93px;font-size:31px">☼</div></div><div class="game-question">“Everyone is smiling. Everyone is exactly the same.”</div><button class="game-answer" data-game-answer="choice">Individual freedom and difference</button><button class="game-answer" data-game-answer="choice">Harmony through conformity</button><button class="game-answer" data-game-answer="choice">A world without politics</button><div class="feedback hidden" id="gameFeedback"><b>Good noticing!</b> “Harmony through conformity” is one possible reading. There’s no single right answer—the interesting part is asking who benefits, who gets to choose, and what the image leaves out.</div><div style="display:flex;justify-content:flex-end;margin-top:15px"><button class="btn small hidden" id="gameDone" data-action="close-game">Lovely, I’m done ✓</button></div></div>`}
    function celebrate(){const modal=document.getElementById('celebrateModal');modal.classList.remove('hidden');modal.innerHTML=`<div class="modal-card" style="text-align:center;padding:38px 28px"><button class="icon-btn modal-close" data-action="close-celebrate" aria-label="Close">×</button><div style="font-size:46px;margin-bottom:8px">✳</div><span class="eyebrow">Chapter complete</span><h2 style="margin:9px auto">Look at you, following your curiosity.</h2><p style="margin:0 auto 20px">You connected the everyday things you love with the bigger ideas behind them. That’s something worth sharing.</p><button class="btn" data-action="share">Share your progress ↗</button><div style="margin-top:14px"><button class="link-btn" data-action="next-topic">See what to explore next →</button></div></div>`}
    function share(){const text='I’m exploring how political ideas shape the books, music and culture around us with Saga. Come be curious with me ✳';if(navigator.share)navigator.share({title:'My Saga curriculum',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>showToast('A share note is copied to your clipboard ✨')).catch(()=>showToast('Ready to share your chapter ✨'));else showToast('Ready to share your chapter ✨')}
    document.addEventListener('click',e=>{const b=e.target.closest('button'),card=e.target.closest('.gallery-resource[data-resource]');if(card&&!b){state.selectedResource=card.dataset.resource;state.page='resource';render();window.scrollTo({top:0,behavior:'smooth'});return}if(!b)return;if(b.dataset.filter){const key=b.dataset.filterScope==='curriculum'?'curriculumFilter':b.dataset.filterScope==='profile'?'profileResourceFilter':'savedResourceFilter';state[key]=b.dataset.filter;render();return}if(b.dataset.openResource){state.selectedResource=b.dataset.openResource;state.page='resource';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.trendSave){state.selectedTrend=b.dataset.trendSave;toggleTrendSave();return}if(b.dataset.page){state.profileOwner='mariela';setPage(b.dataset.page);return}if(b.dataset.category){state.selectedCategory=b.dataset.category;state.page='category';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.guide){state.selectedGuide=b.dataset.guide;state.page='guide';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.trend){state.selectedTrend=b.dataset.trend;state.page='trend';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.topic){state.selectedTopic=b.dataset.topic;state.page='paths';state.flow='';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.depth){state.depth=b.dataset.depth;state.page='curriculum';state.flow='';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.answer){state.quizAnswers[state.quizStep]=b.dataset.answer;render();return}if(b.dataset.check){const id=b.dataset.check;state.checklist[id]=!state.checklist[id];localStorage.setItem('curio-checklist',JSON.stringify(state.checklist));render();if(activeResources().every(r=>state.checklist[r.id]))setTimeout(()=>celebrate(),250);return}if(b.dataset.save){const id=b.dataset.save;if(state.saved.includes(id))state.saved=state.saved.filter(x=>x!==id);else state.saved.push(id);localStorage.setItem('curio-saved',JSON.stringify(state.saved));render();showToast(state.saved.includes(id)?'Saved to your library':'Removed from saved');return}if(b.dataset.tab){state.profileTab=b.dataset.tab;render();return}if(b.dataset.gameAnswer){document.querySelectorAll('.game-answer').forEach(x=>x.style.borderColor='#e9e6dd');b.style.borderColor='#74917e';document.getElementById('gameFeedback').classList.remove('hidden');document.getElementById('gameDone').classList.remove('hidden');state.checklist.activity=true;localStorage.setItem('curio-checklist',JSON.stringify(state.checklist));return}const a=b.dataset.action;if(!a)return;switch(a){case'discover':setPage('discover');break;case'know':setFlow('know');break;case'back-home':state.page='home';render();window.scrollTo({top:0,behavior:'smooth'});break;case'back-category':state.page='category';render();window.scrollTo({top:0,behavior:'smooth'});break;case'back-curriculum':state.page='curriculum';render();window.scrollTo({top:0,behavior:'smooth'});break;case'back-notes':state.page='curriculum';render();setTimeout(()=>document.getElementById('notes')?.scrollIntoView({behavior:'smooth',block:'center'}),50);break;case'open-guide':state.selectedCategory='culture';state.selectedGuide='politics';state.page='guide';render();window.scrollTo({top:0,behavior:'smooth'});break;case'trend-left':document.getElementById('trendingTrack')?.scrollBy({left:-310,behavior:'smooth'});break;case'trend-right':document.getElementById('trendingTrack')?.scrollBy({left:310,behavior:'smooth'});break;case'save-guide':if(state.savedGuides.includes(state.selectedGuide))state.savedGuides=state.savedGuides.filter(x=>x!==state.selectedGuide);else state.savedGuides.push(state.selectedGuide);localStorage.setItem('saga-guides',JSON.stringify(state.savedGuides));render();showToast(state.savedGuides.includes(state.selectedGuide)?'Guide saved':'Removed from saved guides');break;case'save-trend':toggleTrendSave();break;case'start-theme':state.selectedTopic='politics';state.page='paths';render();window.scrollTo({top:0,behavior:'smooth'});break;case'unsure':state.quizStep=0;state.quizAnswers=[];setFlow('quiz');break;case'start-quiz':state.quizStep=0;state.quizAnswers=[];state.flow='quiz';render();break;case'quiz-next':if(!state.quizAnswers[state.quizStep])return;state.quizStep++;render();break;case'quiz-back':state.quizStep=Math.max(0,state.quizStep-1);render();break;case'retake':state.quizStep=0;state.quizAnswers=[];render();break;case'share':share();break;case'save-theme':if(state.savedThemes.includes('politics'))state.savedThemes=state.savedThemes.filter(x=>x!=='politics');else state.savedThemes.push('politics');localStorage.setItem('curio-themes',JSON.stringify(state.savedThemes));render();showToast(state.savedThemes.includes('politics')?'Theme saved for a future chapter ✨':'Theme removed from saved');break;case'podcast-play':window.open('https://www.bbc.co.uk/programmes/w3cswp5x','_blank','noopener');break;case'game':renderGame();break;case'close-game':document.getElementById('gameModal').classList.add('hidden');if(state.page==='curriculum')render();break;case'celebrate':celebrate();break;case'close-celebrate':document.getElementById('celebrateModal').classList.add('hidden');break;case'people':showToast('Contributor shelf coming soon ✨');break;case'resource':state.page='resource';render();break;case'follow':state.following=!state.following;render();showToast(state.following?'You’re following Sofia ✨':'Unfollowed Sofia');break;case'next-topic':document.getElementById('celebrateModal').classList.add('hidden');state.page='home';render();window.scrollTo({top:0,behavior:'smooth'});showToast('Maybe take a look at doing business or photography ✨');break;}});
    document.addEventListener('input',e=>{if(e.target.id==='discoverSearch'){state.discoverSearch=e.target.value;const box=document.getElementById('discoverSearchResults');if(box)box.innerHTML=discoverSearchResults(state.discoverSearch);return}if(e.target.id==='notes'){state.notes=e.target.value;localStorage.setItem('curio-notes',state.notes);const s=document.getElementById('saveState');if(s)s.textContent='Saving…';clearTimeout(window.notesTimer);window.notesTimer=setTimeout(()=>{const n=document.getElementById('saveState');if(n)n.textContent='Saved just for you';},500)}});
    render();
  document.addEventListener('click',e=>{const check=e.target.closest('.resource-check[data-check]');if(check){e.preventDefault();e.stopImmediatePropagation();const id=check.dataset.check;state.checklist[id]=!state.checklist[id];localStorage.setItem('curio-checklist',JSON.stringify(state.checklist));render();if(activeResources().every(r=>state.checklist[r.id]))setTimeout(()=>celebrate(),250);}},true);</script>
